<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader Ad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #111;
            color: #fff;
        }
        .timer {
            font-size: 24px;
            color: #ff3b30;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <h2>🔥 Please wait while your ad loads...</h2>
    <p>Your download will unlock in a moment.</p>
    <div class="timer" id="countdown">15</div>

    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        let timeLeft = 15;
        let countdownTimer = setInterval(function() {
            timeLeft--;
            document.getElementById("countdown").innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                // Send signal back to bot and close window automatically!
                tg.sendData("watched");
                tg.close();
            }
        }, 1000);
    </script>
</body>
</html>
