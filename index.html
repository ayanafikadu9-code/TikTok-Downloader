<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader - Ad Verification</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #000000);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
        .container {
            max-width: 400px;
            width: 100%;
        }
        h2 {
            margin-bottom: 10px;
            font-size: 22px;
        }
        p {
            color: var(--tg-theme-hint-color, #707579);
            font-size: 14px;
            margin-bottom: 30px;
        }
        .timer {
            font-size: 48px;
            font-weight: bold;
            color: var(--tg-theme-button-color, #2481cc);
            margin-bottom: 30px;
        }
        .btn {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            border-radius: 8px;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 600;
            width: 100%;
            cursor: pointer;
            display: none;
        }
        .btn:active {
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Ad Verification</h2>
        <p>Please wait while the verification completes to unlock your TikTok video.</p>
        <div class="timer" id="count">10</div>
        <button class="btn" id="doneBtn" onclick="finishTask()">Continue to Bot</button>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let timeLeft = 10;
        const countEl = document.getElementById('count');
        const doneBtn = document.getElementById('doneBtn');

        const timer = setInterval(() => {
            timeLeft--;
            countEl.textContent = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(timer);
                countEl.style.display = 'none';
                doneBtn.style.display = 'block';
            }
        }, 1000);

        function finishTask() {
            // Sends data back to bot and closes web app window
            tg.sendData("AD_COMPLETED");
        }
    </script>
</body>
</html>
