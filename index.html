<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader — Ad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 40px;
            background-color: #111;
            color: #fff;
            margin: 0;
        }
        .timer {
            font-size: 24px;
            color: #ff3b30;
            margin-top: 20px;
        }
        .ad-slot {
            margin: 30px auto;
            width: 90%;
            max-width: 320px;
            min-height: 250px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: #888;
            font-size: 14px;
        }
        .continue-btn {
            display: none;
            margin: 30px auto 0;
            padding: 14px 32px;
            font-size: 18px;
            font-weight: bold;
            background: #2ea043;
            color: #fff;
            border: none;
            border-radius: 8px;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <h2>🔥 Please wait while your ad loads...</h2>
    <p>Stay on this page until the timer finishes.</p>

    <div class="ad-slot" id="ad-slot">
        <!-- Paste your Monetag ad script/tag here, from Monetag
             dashboard -> your zone -> "Get code". -->
        Ad goes here
    </div>

    <div class="timer" id="countdown">15</div>

    <!-- CHANGE_ME: replace with your bot's @username (no @ symbol) -->
    <a id="continue-btn" class="continue-btn" href="<a href="https://t.me/TIKTOK_ETbot?start=verified">Send Message</a>
">
        ✅ Continue
    </a>

    <script>
        let timeLeft = 15;
        const countdownEl = document.getElementById("countdown");
        const continueBtn = document.getElementById("continue-btn");

        let countdownTimer = setInterval(function () {
            timeLeft--;
            countdownEl.innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                countdownEl.style.display = "none";
                continueBtn.style.display = "inline-block";
            }
        }, 1000);
    </script>
</body>
</html>
