<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader — Watch Ad</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: #1a1a1a;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            padding: 40px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            color: #fff;
        }
        
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
            color: #ff3b30;
            font-weight: bold;
        }
        
        .subtitle {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 30px;
            line-height: 1.5;
        }
        
        .ad-slot {
            width: 100%;
            min-height: 280px;
            background: #222;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 30px 0;
            border: 2px solid #333;
            font-size: 14px;
            color: #666;
            font-style: italic;
            overflow: hidden;
        }
        
        .timer-section {
            margin: 30px 0;
        }
        
        .timer-label {
            font-size: 14px;
            color: #aaa;
            margin-bottom: 10px;
        }
        
        .timer {
            font-size: 48px;
            font-weight: bold;
            color: #ff3b30;
            font-family: 'Courier New', monospace;
            animation: pulse 1s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 30px;
        }
        
        .verify-btn {
            display: none;
            width: 100%;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            background: linear-gradient(135deg, #2ea043 0%, #27a934 100%);
            color: #fff;
            border: none;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(46, 160, 67, 0.3);
        }
        
        .verify-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(46, 160, 67, 0.4);
            background: linear-gradient(135deg, #27a934 0%, #1fa82b 100%);
        }
        
        .verify-btn:active:not(:disabled) {
            transform: translateY(0);
        }
        
        .verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .back-btn {
            width: 100%;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 10px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .back-btn:hover {
            background: #444;
            border-color: #666;
        }
        
        .info-text {
            font-size: 13px;
            color: #999;
            margin-top: 20px;
            line-height: 1.6;
        }
        
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #aaa;
        }
        
        .status.loading::before {
            content: "⏳ ";
        }
        
        .status.complete {
            color: #2ea043;
        }
        
        .status.complete::before {
            content: "✅ ";
        }
        
        .error {
            color: #ff3b30;
        }
        
        .error::before {
            content: "❌ ";
        }
        
        /* Mobile responsiveness */
        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            .timer {
                font-size: 40px;
            }
            
            .ad-slot {
                min-height: 220px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Watch Ad to Unlock</h1>
        <p class="subtitle">Your TikTok download will be ready when the timer finishes!</p>
        
        <!-- Ad Space - Monetag Code Here -->
        <div class="ad-slot" id="ad-slot">
            <!-- PASTE YOUR MONETAG AD CODE HERE -->
            Ad is loading... Please wait.
        </div>
        
        <!-- Timer Section -->
        <div class="timer-section">
            <div class="timer-label">⏱️ Time Remaining:</div>
            <div class="timer" id="countdown">15</div>
            <div class="status loading" id="status">Watching ad... Do not close this tab!</div>
        </div>
        
        <!-- Action Buttons -->
        <div class="button-container">
            <button id="continue-btn" class="verify-btn" onclick="handleVerify()" disabled>
                ✅ Verify & Get Your Video
            </button>
            <a href="https://t.me/TIKTOK_ETbot" class="back-btn">
                ◀️ Back to Bot
            </a>
        </div>
        
        <p class="info-text">
            💡 <strong>Tip:</strong> Make sure you watch the complete ad. Do not close this tab or refresh!
        </p>
    </div>

    <script>
        let timeLeft = 15;
        let adComplete = false;
        const countdownEl = document.getElementById("countdown");
        const continueBtn = document.getElementById("continue-btn");
        const statusEl = document.getElementById("status");
        
        // Get user_id and job_id from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get("user_id");
        const jobId = urlParams.get("job_id");
        const tiktokUrl = urlParams.get("link");

        // Countdown Timer - MUST COMPLETE FULLY
        let countdownTimer = setInterval(function () {
            timeLeft--;
            countdownEl.innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                adComplete = true;
                countdownEl.innerText = "✅ Complete!";
                continueBtn.style.display = "block";
                continueBtn.disabled = false;
                statusEl.textContent = "Ad completed! Click below to verify and get your video.";
                statusEl.classList.add("complete");
                statusEl.classList.remove("loading");
            }
        }, 1000);

        // Handle Verify Button - VERIFY WITH BACKEND
        async function handleVerify() {
            if (!adComplete) {
                statusEl.textContent = "⏳ Please wait for timer to finish!";
                statusEl.classList.add("error");
                return;
            }
            
            continueBtn.disabled = true;
            statusEl.textContent = "Verifying... Please wait...";
            
            try {
                // Call bot backend to verify ad completion
                const response = await fetch("https://your-render-url.onrender.com/verify_ad", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_id: userId,
                        job_id: jobId,
                        tiktok_url: tiktokUrl
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusEl.textContent = "✅ Verified! Redirecting to Telegram...";
                    statusEl.classList.remove("error");
                    statusEl.classList.add("complete");
                    
                    // Redirect to bot with verified token
                    setTimeout(() => {
                        window.location.href = `https://t.me/TIKTOK_ETbot?start=ad_verified_${jobId}`;
                    }, 2000);
                } else {
                    statusEl.textContent = "❌ Verification failed. Please try again.";
                    statusEl.classList.add("error");
                    continueBtn.disabled = false;
                }
            } catch (error) {
                console.error("Verification error:", error);
                statusEl.textContent = "❌ Network error. Please try again.";
                statusEl.classList.add("error");
                continueBtn.disabled = false;
            }
        }

        // Prevent tab close during ad watch
        window.addEventListener("beforeunload", function (e) {
            if (!adComplete) {
                e.preventDefault();
                e.returnValue = "Ad not completed! Are you sure?";
                return "Ad not completed!";
            }
        });

        // Check if parameters exist
        if (!userId || !jobId) {
            statusEl.textContent = "⚠️ Missing parameters. Please go back to bot.";
            statusEl.classList.add("error");
            countdownEl.innerText = "❌";
            clearInterval(countdownTimer);
        }
    </script>
</body>
</html>
