<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Monetag Tag Script -->
    <script src="https://quge5.com/88/tag.min.js" data-zone="269438" async data-cfasync="false"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        
        .container {
            background: #1a1a1a;
            border-radius: 14px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            padding: 24px 18px;
            max-width: 460px;
            width: 100%;
            text-align: center;
            color: #fff;
        }
        
        h1 {
            font-size: 22px;
            margin-bottom: 8px;
            color: #ff3b30;
            font-weight: bold;
        }
        
        .subtitle {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 18px;
            line-height: 1.4;
        }
        
        .ad-slot {
            width: 100%;
            min-height: 280px;
            background: #222;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
            border: 2px solid #333;
            overflow: hidden;
            position: relative;
        }
        
        .timer-section {
            margin: 18px 0;
        }
        
        .timer-label {
            font-size: 12px;
            color: #aaa;
            margin-bottom: 4px;
        }
        
        .timer {
            font-size: 36px;
            font-weight: bold;
            color: #ff3b30;
            font-family: 'Courier New', monospace;
        }
        
        .button-container {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 18px;
        }
        
        .verify-btn {
            display: none;
            width: 100%;
            padding: 13px;
            font-size: 15px;
            font-weight: bold;
            background: linear-gradient(135deg, #2ea043 0%, #27a934 100%);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(46, 160, 67, 0.3);
        }
        
        .verify-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .back-btn {
            width: 100%;
            padding: 11px;
            font-size: 13px;
            font-weight: bold;
            background: #333;
            color: #fff;
            border: 1px solid #555;
            border-radius: 8px;
            text-decoration: none;
        }
        
        .status {
            margin-top: 8px;
            font-size: 13px;
            color: #aaa;
        }
        
        .status.complete {
            color: #2ea043;
        }
        
        .error {
            color: #ff3b30;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔥 Watch Ad to Unlock</h1>
        <p class="subtitle">Your TikTok download will be ready when the timer finishes!</p>
        
        <div class="ad-slot" id="ad-slot">
            <script>(function(s){s.dataset.zone='11560031',s.src='https://nap5k.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
        </div>
        
        <div class="timer-section">
            <div class="timer-label">⏱️ Time Remaining:</div>
            <div class="timer" id="countdown">15</div>
            <div class="status" id="status">Watching ad... Please wait!</div>
        </div>
        
        <div class="button-container">
            <button id="continue-btn" class="verify-btn" onclick="handleVerify()" disabled>
                ✅ Verify & Get Your Video
            </button>
            <a href="https://t.me/TIKTOK_ETbot" class="back-btn">
                ◀️ Back to Bot
            </a>
        </div>
    </div>

    <script>
        let timeLeft = 15;
        let adComplete = false;
        const countdownEl = document.getElementById("countdown");
        const continueBtn = document.getElementById("continue-btn");
        const statusEl = document.getElementById("status");
        
        const urlParams = new URLSearchParams(window.location.search);
        const userId = urlParams.get("user_id");
        const jobId = urlParams.get("job_id");
        const tiktokUrl = urlParams.get("link");

        let countdownTimer = setInterval(function () {
            timeLeft--;
            countdownEl.innerText = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                adComplete = true;
                countdownEl.innerText = "✅ Complete!";
                continueBtn.style.display = "block";
                continueBtn.disabled = false;
                statusEl.textContent = "Ad completed! Click below to verify.";
                statusEl.classList.add("complete");
            }
        }, 1000);

        async function handleVerify() {
            if (!adComplete) return;
            
            continueBtn.disabled = true;
            statusEl.textContent = "Verifying... Please wait...";
            
            try {
                // UPDATE THIS URL TO YOUR ACTIVE RENDER WEB SERVICE URL
                const response = await fetch("https://tiktok-downloader-z10d.onrender.com/verify_ad", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        user_id: userId,
                        job_id: jobId,
                        tiktok_url: tiktokUrl
                    })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    statusEl.textContent = "✅ Verified! Redirecting to Telegram...";
                    statusEl.classList.add("complete");
                    setTimeout(() => {
                        window.location.href = `https://t.me/TIKTOK_ETbot`;
                    }, 1500);
                } else {
                    statusEl.textContent = "❌ Verification failed. Try again.";
                    statusEl.classList.add("error");
                    continueBtn.disabled = false;
                }
            } catch (error) {
                statusEl.textContent = "❌ Network error. Check connection.";
                statusEl.classList.add("error");
                continueBtn.disabled = false;
            }
        }
    </script>
</body>
</html>
