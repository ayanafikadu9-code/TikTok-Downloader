<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader Ad</title>
    <!-- Include Telegram WebApp SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
        }
        h2 { margin-bottom: 10px; font-size: 22px; }
        p { color: #94a3b8; font-size: 14px; margin-bottom: 30px; }
        button {
            background-color: #2563eb;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            max-width: 300px;
            transition: background-color 0.2s;
        }
        button:disabled {
            background-color: #334155;
            color: #64748b;
            cursor: not-allowed;
        }
        button:not(:disabled):active { background-color: #1d4ed8; }
    </style>
</head>
<body>

    <h2 id="title">Watch Ad to Download Video</h2>
    <p id="desc">Please wait <span id="countdown">15</span> seconds to unlock your video...</p>
    
    <!-- Continue Button (Disabled until timer finishes) -->
    <button id="continue-btn" disabled>Please wait...</button>

    <script>
        // Initialize Telegram WebApp
        const tg = window.Telegram.WebApp;
        tg.ready();
        tg.expand();

        let timeLeft = 15;
        const countdownEl = document.getElementById("countdown");
        const continueBtn = document.getElementById("continue-btn");
        const descEl = document.getElementById("desc");

        // 15-second countdown timer loop
        const timer = setInterval(() => {
            timeLeft--;
            countdownEl.textContent = timeLeft;
            
            if (timeLeft <= 0) {
                clearInterval(timer);
                descEl.textContent = "Click below to complete verification and get your video:";
                continueBtn.textContent = "Continue";
                continueBtn.disabled = false;
            }
        }, 1000);

        // When user clicks Continue after the timer finishes
        continueBtn.addEventListener("click", function() {
            if (!continueBtn.disabled) {
                // Send signal back to Python bot and close web app
                tg.sendData("AD_COMPLETED");
            }
        });
    </script>
</body>
</html>
