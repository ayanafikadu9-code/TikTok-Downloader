<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Downloader — Ad</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            background-color: #111;
            color: #fff;
            margin: 0;
        }
        .timer {
            font-size: 24px;
            color: #ff3b30;
            margin-top: 20px;
        }
        .hint {
            color: #999;
            font-size: 14px;
            margin-top: 30px;
            padding: 0 20px;
        }
        /* Monetag ad slot. Paste your Monetag ad tag/script here —
           get it from your Monetag dashboard under your Zone's
           "Get code" button, then replace this whole div's contents. */
        .ad-slot {
            margin: 30px auto;
            width: 90%;
            max-width: 320px;
            min-height: 250px;
            background: #222;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            color: #888;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <h2>🔥 Please wait while your ad loads...</h2>
    <p>Keep this page open, then go back to the bot.</p>

    <div class="ad-slot" id="ad-slot">
        <!-- Paste Monetag script/tag here -->
        Ad goes here
    </div>

    <div class="timer" id="countdown">15</div>
    <p class="hint">Once the timer finishes, switch back to Telegram and tap
        "I have watched the ad".</p>

    <script>
        let timeLeft = 15;
        let countdownTimer = setInterval(function () {
            timeLeft--;
            document.getElementById("countdown").innerText = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(countdownTimer);
                document.getElementById("countdown").innerText = "✅ Done — go back to Telegram";
            }
        }, 1000);
    </script>
</body>
</html>
